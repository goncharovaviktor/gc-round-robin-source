<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Генератор секретов GC Round Robin</title>
  <style>
    body{font:16px/1.45 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}
    button{padding:10px 15px;cursor:pointer}code{display:block;overflow-wrap:anywhere;background:#f2f4f7;padding:12px;margin:8px 0 18px}
    .note{color:#56606b}
  </style>
</head>
<body>
  <h1>Локальный генератор секретов</h1>
  <p class="note">Страница не использует сеть. Значения создаются браузером только на этом устройстве.</p>
  <button id="generate" type="button">Создать новые секреты</button>
  <h2>WEBHOOK_SECRET</h2><code id="webhook">Нажмите кнопку</code>
  <h2>ADMIN_TOKEN</h2><code id="admin">Нажмите кнопку</code>
  <script>
    const randomHex = () => Array.from(crypto.getRandomValues(new Uint8Array(32)),
      byte => byte.toString(16).padStart(2, "0")).join("");
    document.querySelector("#generate").addEventListener("click", () => {
      document.querySelector("#webhook").textContent = randomHex();
      document.querySelector("#admin").textContent = randomHex();
    });
  </script>
</body>
</html>
